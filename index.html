<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen — 하루를 가볍게</title>
<meta name="description" content="Lumen과 함께 할 일, 메모, 일정을 한 곳에서. 출시 알림을 받아보세요.">
<style>
  :root{--bg:#0b1020;--fg:#eef1ff;--muted:#a3abc8;--accent:#7c8cff;--accent2:#4de2c5;--card:#141a33}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif;background:var(--bg);color:var(--fg);line-height:1.6}
  .wrap{max-width:960px;margin:0 auto;padding:0 20px}
  header{padding:20px 0;font-weight:700;letter-spacing:.5px}
  .hero{text-align:center;padding:72px 0 56px;background:radial-gradient(600px 300px at 50% 0,rgba(124,140,255,.25),transparent)}
  h1{font-size:clamp(2rem,6vw,3.4rem);line-height:1.2;margin:0 0 16px}
  h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--muted);font-size:1.1rem;max-width:520px;margin:0 auto 32px}
  form{display:flex;gap:8px;max-width:440px;margin:0 auto;flex-wrap:wrap;justify-content:center}
  input{flex:1 1 240px;padding:14px 16px;border-radius:10px;border:1px solid #2a3260;background:var(--card);color:var(--fg);font-size:1rem}
  button{padding:14px 22px;border:0;border-radius:10px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#0b1020;font-weight:700;font-size:1rem;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  #msg{min-height:1.6em;margin-top:14px;font-size:.95rem}
  .features{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;padding:24px 0 64px}
  .card{background:var(--card);border:1px solid #232b52;border-radius:14px;padding:24px}
  .card h3{margin:0 0 8px}.card p{margin:0;color:var(--muted)}
  footer{text-align:center;color:var(--muted);padding:24px 0 40px;font-size:.85rem;border-top:1px solid #1c2344}
</style>
</head>
<body>
<div class="wrap">
  <header>✦ Lumen</header>
  <section class="hero">
    <h1>복잡한 하루를<br><span>가볍게</span> 정리하세요</h1>
    <p>할 일, 메모, 일정을 한 곳에서. 곧 출시됩니다. 이메일을 남기면 가장 먼저 알려드릴게요.</p>
    <form id="f">
      <input id="email" type="email" required placeholder="you@example.com" autocomplete="email" aria-label="이메일">
      <button id="btn" type="submit">알림 받기</button>
    </form>
    <div id="msg" role="status"></div>
  </section>
  <section class="features">
    <div class="card"><h3>⚡ 빠른 입력</h3><p>떠오른 생각을 단 한 줄로 기록하세요.</p></div>
    <div class="card"><h3>🗓 스마트 일정</h3><p>겹치는 일정은 자동으로 알려드립니다.</p></div>
    <div class="card"><h3>🔒 안전한 보관</h3><p>데이터는 암호화되어 안전하게 저장됩니다.</p></div>
  </section>
  <footer>© 2026 Lumen</footer>
</div>
<script>
  const SUPABASE_URL = "https://ncisgrobzqcnbnplvjbl.supabase.co";
  const SUPABASE_KEY = "sb_publishable_R003R32wf7HiWXGi7SFasw_Ki-HoqDK";
  const f = document.getElementById("f"), msg = document.getElementById("msg"), btn = document.getElementById("btn");
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    btn.disabled = true; msg.style.color = ""; msg.textContent = "등록 중...";
    try {
      const r = await fetch(SUPABASE_URL + "/rest/v1/signups", {
        method: "POST",
        headers: {"Content-Type":"application/json", apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY, Prefer: "return=minimal"},
        body: JSON.stringify({email: document.getElementById("email").value.trim()})
      });
      if (r.ok) { msg.style.color = "#4de2c5"; msg.textContent = "등록되었습니다! 출시 때 연락드릴게요 🎉"; f.reset(); }
      else if (r.status === 409) { msg.style.color = "#4de2c5"; msg.textContent = "이미 등록된 이메일이에요. 감사합니다!"; }
      else { throw new Error(r.status); }
    } catch (err) { msg.style.color = "#ff8a8a"; msg.textContent = "오류가 발생했어요. 잠시 후 다시 시도해 주세요."; }
    btn.disabled = false;
  });
</script>
</body>
</html>
<!-- auto-deploy test -->
